<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get PuttPace</title>
<meta name="description" content="Putting tempo trainer. Same tempo every putt; only the stroke length changes. Try it free for 7 days on iPhone and Android.">
<meta property="og:title" content="Get PuttPace">
<meta property="og:description" content="Same tempo. Right length. Every putt. Try it free for 7 days.">
<meta property="og:image" content="https://stepa780.github.io/puttpace-site/app/icon-512.png">
<meta name="theme-color" content="#13241A">
<link rel="icon" href="../app/icon-192.png">
<link rel="apple-touch-icon" href="../app/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --green: #13241A; --forest: #1F4A33; --cream: #F2E8CF; --gold: #D49A2E; --muted: #A9AE98; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: radial-gradient(120% 70% at 50% 0%, var(--forest), var(--green) 70%);
    color: var(--cream); font: 500 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 440px; padding: 56px 20px 40px; text-align: center; }
  .mark { width: 64px; height: auto; display: block; margin: 0 auto 20px; }
  h1 { font-weight: 900; font-size: 40px; letter-spacing: -0.02em; margin: 0; }
  .tag { margin: 6px 0 32px; color: var(--muted); font-size: 17px; }
  .tag b { color: var(--gold); font-weight: 700; }
  .btn {
    display: flex; align-items: center; gap: 14px; text-align: left; text-decoration: none;
    padding: 16px 18px; border-radius: 16px; margin-bottom: 14px; transition: transform .12s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn svg { flex: none; width: 30px; height: 30px; }
  .btn .t { font-weight: 900; font-size: 19px; display: block; }
  .btn .s { font-size: 14px; display: block; opacity: 0.8; }
  .primary { background: var(--gold); color: var(--green); }
  .secondary { background: transparent; color: var(--cream); border: 2px solid rgba(242,232,207,0.35); }
  .hint { font-size: 14px; color: var(--muted); margin: 4px 0 28px; }
  .hint b { color: var(--cream); }
  .trial { font-weight: 700; font-size: 17px; margin: 8px 0 0; }
  footer { margin-top: 44px; font-size: 13px; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 331 352" aria-hidden="true"><rect width="37" height="352" fill="#F2E8CF"/><rect x="95" width="37" height="352" fill="#F2E8CF"/><circle cx="243" cy="88" r="88" fill="#D49A2E"/></svg>
  <h1>PuttPace</h1>
  <p class="tag">Same tempo. Right length. <b>Every putt.</b></p>

  <a id="iphone" class="btn secondary" href="https://stepa780.github.io/puttpace-site/app/">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.3 1.2 9.7.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.5-1-2.5-3.8zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.6 2.8-1.4z"/></svg>
    <span><span class="t">iPhone</span><span class="s">Open the web app in Safari</span></span>
  </a>
  <p class="hint" id="iphone-hint">Then tap <b>Share</b> → <b>Add to Home Screen</b> to keep it like an app.</p>

  <a id="android" class="btn secondary" href="https://play.google.com/store/apps/details?id=com.puttpace.app">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.3c-.2.2-.3.6-.3 1v17.4c0 .4.1.8.3 1l9.7-9.7L3.6 2.3zm10.8 10.8 2.6 2.6-11 6.3c-.4.2-.8.3-1.1.2l9.5-9.1zm0-2.2L4.9 1.8c.3-.1.7 0 1.1.2l11 6.3-2.6 2.6zm3.6-1.9 3 1.7c.9.5.9 1.3 0 1.8l-3 1.7-2.9-2.6 2.9-2.6z"/></svg>
    <span><span class="t">Android</span><span class="s">Get it on Google Play</span></span>
  </a>

  <p class="trial">Try it free for 7 days.</p>

  <footer>
    By Sunday Studio Apps · <a href="../">Privacy</a>
  </footer>
</main>
<script>
  // Put the visitor's own phone first, in gold.
  var ua = navigator.userAgent || "";
  var mine = /Android/i.test(ua) ? "android" : /iPhone|iPad|iPod/i.test(ua) ? "iphone" : null;
  if (mine) {
    var el = document.getElementById(mine);
    el.classList.replace("secondary", "primary");
    if (mine === "android") el.parentNode.insertBefore(el, document.getElementById("iphone"));
  }
</script>
</body>
</html>
